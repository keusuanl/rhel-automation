# Minimal bootstrap for the RHEL lab: installs the OS and leaves a way in for Ansible.
# WARNING: clearpart --all wipes every disk the installer sees. Only use on a blank VM.
cdrom
text
lang en_GB.UTF-8
keyboard --xlayouts='gb'
timezone Europe/London --utc
rootpw --lock
user --name=labadmin --uid=1000 --groups=wheel --lock
sshkey --username=labadmin "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFoANjNQ0sxey8oUSv8eZ4wFENHgvj35qUwD4bA0vwvk labadmin@control01.lab.local"
selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd
network --device=ens160 --bootproto=dhcp --onboot=yes --activate
network --hostname=app01.lab.local
zerombr
clearpart --all --initlabel
autopart --type=lvm
reboot

%packages
@^minimal-environment
firewalld
%end

%post
echo 'labadmin ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/labadmin
chmod 440 /etc/sudoers.d/labadmin

cat > /etc/NetworkManager/system-connections/lab-lan.nmconnection << NMEOF
[connection]
id=lab-lan
type=ethernet
interface-name=ens192
autoconnect=true
autoconnect-priority=100

[ipv4]
method=manual
address1=10.50.0.12/24
never-default=true

[ipv6]
method=disabled
NMEOF
chmod 600 /etc/NetworkManager/system-connections/lab-lan.nmconnection
restorecon -R /etc/NetworkManager/system-connections /etc/sudoers.d || true
%end
